services:
  postgres:
    image: postgres:16-alpine
    container_name: paylance-postgres
    environment:
      POSTGRES_DB: ${PAYLANCE_DB_NAME:-paylance}
      POSTGRES_USER: ${PAYLANCE_DB_USER:-paylance}
      POSTGRES_PASSWORD: ${PAYLANCE_DB_PASSWORD:-paylance}
    ports:
      - "${PAYLANCE_DB_PORT:-5432}:5432"
    volumes:
      - paylance_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PAYLANCE_DB_USER:-paylance} -d ${PAYLANCE_DB_NAME:-paylance}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: paylance-redis
    ports:
      - "${PAYLANCE_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - paylance_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: paylance-adminer
    ports:
      - "8081:8080"
    depends_on:
      - postgres

volumes:
  paylance_postgres_data:
  paylance_redis_data:
