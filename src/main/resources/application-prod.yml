spring:
  config:
    activate:
      on-profile: prod

  datasource:
    # Pas de valeur par défaut : si l'EnvironmentFile du serveur prod est incomplet,
    # le démarrage échoue immédiatement plutôt que de retomber silencieusement sur autre chose.
    url: ${SPRING_DATASOURCE_URL}
    username: ${KEBPAY_DB_USER}
    password: ${KEBPAY_DB_PASSWORD}
    hikari:
      pool-name: kebpay-hikari
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    show-sql: false

  flyway:
    validate-on-migrate: true
    baseline-on-migrate: true
    out-of-order: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    root: WARN
    com.kebpay: INFO

management:
  endpoint:
    health:
      show-details: never
