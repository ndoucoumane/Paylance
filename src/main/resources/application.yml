spring:
  application:
    name: paylance

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate / validate-on-migrate / out-of-order : définis par profil
    # (application-dev/staging/prod.yml), pas ici — voir ces fichiers.

  data:
    web:
      pageable:
        # Plafond de taille de page (export CSV du front : 1000). Au-delà, Spring ramène à 1000.
        max-page-size: 1000
    redis:
      host: ${PAYLANCE_REDIS_HOST:localhost}
      port: ${PAYLANCE_REDIS_PORT:6379}
      password: ${PAYLANCE_REDIS_PASSWORD:}
      timeout: 3000ms

  jackson:
    # Charges serveur à serveur (callbacks signés) : champs nuls omis. Les réponses lues par le
    # front portent @JsonInclude(ALWAYS) et renvoient explicitement null (contrat front).
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false


server:
  shutdown: graceful
  # port : défini par profil (application-dev/staging/prod.yml) — chaque environnement a le sien.

management:
  # Actuator (métriques, Prometheus...) servi sur un port dédié, lié à 127.0.0.1 : jamais exposé
  # publiquement, pas de clé statique à gérer. Port défini par profil.
  server:
    address: ${PAYLANCE_MANAGEMENT_ADDRESS:127.0.0.1}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: paylance

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

paylance:
  security:
    # Keycloak (dashboard) : non branché tant que cette variable est vide — les routes
    # authentifiées par JWT répondent alors 401. Aucune valeur par défaut volontairement.
    keycloak-issuer-uri: ${PAYLANCE_KEYCLOAK_ISSUER_URI:}
    # Clé maîtresse AES-256 (32 octets, base64) chiffrant les secrets clients en base.
    # Obligatoire : l'application refuse de démarrer sans elle. Générer : openssl rand -base64 32
    encryption-master-key: ${PAYLANCE_ENCRYPTION_MASTER_KEY:}
    # Origines autorisées en CORS pour le(s) dashboard(s) front Paylance, séparées par des virgules.
    dashboard-origins: ${PAYLANCE_DASHBOARD_ORIGINS:http://localhost:5173}

  reconciliation:
    # Filet de sécurité pour webhook perdu/non reçu, pas le chemin de confirmation principal
    # (voir ReconciliationService) — ces valeurs bornent juste le pire cas si le webhook
    # provider échoue, elles ne remplacent pas un webhook correctement configuré.
    interval-ms: ${RECONCILIATION_INTERVAL_MS:300000}
    stale-after-minutes: ${RECONCILIATION_STALE_AFTER_MINUTES:10}

  # URL publique de l'API, utilisée pour afficher aux clients l'URL de webhook à déclarer chez
  # le prestataire (ex : https://api.paylance.example).
  public-base-url: ${PAYLANCE_PUBLIC_BASE_URL:http://localhost:8082}

  callbacks:
    # Développement local uniquement : autorise les callbacks vers localhost / réseaux privés.
    allow-private-networks: ${PAYLANCE_CALLBACKS_ALLOW_PRIVATE_NETWORKS:false}

  scheduled-payments:
    interval-ms: ${SCHEDULED_PAYMENTS_INTERVAL_MS:60000}

  # Configuration prestataire globale : uniquement des données NON secrètes et communes à tous
  # les clients. Les identifiants (clés API, OAuth, code marchand, secrets webhook) sont propres
  # à chaque compte prestataire d'un client, chiffrés en base (provider_accounts).
  provider:
    wave:
      base-url: ${WAVE_BASE_URL:https://api.wave.com}
      payout-endpoint-path: ${WAVE_PAYOUT_ENDPOINT_PATH:/v1/payout}
      request-timeout: ${WAVE_REQUEST_TIMEOUT:15s}
    orange-money:
      # API Sonatel (developer.orange-sonatel.com) : l'URL dépend de l'environnement du compte.
      live-base-url: ${ORANGE_MONEY_LIVE_BASE_URL:https://api.orange-sonatel.com}
      test-base-url: ${ORANGE_MONEY_TEST_BASE_URL:https://api.sandbox.orange-sonatel.com}
      qr-code-validity-seconds: ${ORANGE_MONEY_QRCODE_VALIDITY_SECONDS:300}
      refund-endpoint-path: ${ORANGE_MONEY_REFUND_ENDPOINT_PATH:/api/eWallet/v4/refund}
      payout-endpoint-path: ${ORANGE_MONEY_PAYOUT_ENDPOINT_PATH:/api/eWallet/v1/cashins}
      request-timeout: ${ORANGE_MONEY_REQUEST_TIMEOUT:15s}

logging:
  level:
    root: INFO
    com.paylance: INFO
