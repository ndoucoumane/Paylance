spring:
  config:
    activate:
      on-profile: dev

  datasource:
    # Garde une valeur par défaut ici (contrairement à staging/prod) : confort en local si .env
    # n'est pas sourcé, la DB pointée reste sans risque (instance docker-compose locale).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/paylance}
    username: ${PAYLANCE_DB_USER:paylance}
    password: ${PAYLANCE_DB_PASSWORD:paylance}
    hikari:
      pool-name: paylance-hikari
      maximum-pool-size: 5
      minimum-idle: 2


  data:
    redis:
      # docker-compose local : Redis exposé sur 6383 (6379 souvent pris par d'autres projets)
      port: ${PAYLANCE_REDIS_PORT:6383}

  jpa:
    show-sql: false

  flyway:
    validate-on-migrate: true
    out-of-order: true
    # pas de baseline-on-migrate : la DB locale est toujours créée depuis V1, jamais de schéma
    # préexistant à "baseliner" comme ça peut arriver en staging/prod.

server:
  port: ${SERVER_PORT:8082}

paylance:
  callbacks:
    allow-private-networks: ${PAYLANCE_CALLBACKS_ALLOW_PRIVATE_NETWORKS:true}

logging:
  level:
    root: INFO
    com.paylance: DEBUG
    # Requêtes SELECT coupées (bruit) — les erreurs SQL restent visibles via les loggers
    # Hibernate/Spring par défaut (WARN/ERROR), non affectés par ce réglage.
    org.hibernate.SQL: WARN

management:
  server:
    port: ${PAYLANCE_MANAGEMENT_PORT:8092}
  endpoint:
    health:
      show-details: always
